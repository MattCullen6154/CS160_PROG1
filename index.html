<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Electric Time Converter</title>
        <link rel="stylesheet" href="style.css">
    </head> 
    <body> 
        <header>
            <h1>Trip Time</h1>
            <p class="description">How long will your trip take?</p>
            <p class="subtitle">Enter your travel distance.</p>
        </header>

        <div class="converter">
        
            <input type="number" id="distance" placeholder="Enter distance in miles" min="0" step="0.1">
        </div>
        <div class="mode-picker" aria-label="Choose transportation mode">
            <button class="mode-option" type="button" data-mode="walking" aria-pressed="false">
                <img class="mode-icon" src="walking.svg" alt="">
                <span>Walk</span>
            </button>
            <button class="mode-option" type="button" data-mode="evolve" aria-pressed="false">
                <img class="mode-icon" src="skateboard.svg" alt="">
                <span>Evolve</span>
            </button>
            <button class="mode-option" type="button" data-mode="onewheel" aria-pressed="false">
                <img class="mode-icon" src="onewheel.svg" alt="">
                <span>Onewheel</span>
            </button>
            <button class="mode-option" type="button" data-mode="razor" aria-pressed="false">
                <img class="mode-icon" src="scooter.svg" alt="">
                <span>Razor</span>
            </button>
        </div>
        <button id="calculate">Calculate</button>

        <div class="container" id="time_walking_container" hidden>
            <label for="time_walking">Walking</label>
            <output id="time_walking"></output>
        </div>
        <div class="container" id="time_bike_container" hidden>
            <label for="time_evolve">Evolve Bamboo GTR</label>
            <output id="time_evolve"></output>
        </div>
        <div class="container" id="time_onewheel_container" hidden>
            <label for="time_onewheel">Onewheel GT</label>
            <output id="time_onewheel"></output>
        </div>
        <div class="container" id="time_razor_container" hidden>
            <label for="time_razor">Razor E Prime</label>
            <output id="time_razor"></output>
        </div>

        <script src="script.js"></script>
    </body>
</html>
